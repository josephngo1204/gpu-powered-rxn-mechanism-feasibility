[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2"]
build-backend = "scikit_build_core.build"

[project]
name = "saddle"
version = "0.0.1"
description = "Saddle: a cuEST mechanism feasibility engine"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pyyaml", "h5py"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "types-pyyaml"]

[project.scripts]
saddle = "saddle.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/saddle"]
build-dir = "build/python"
editable.rebuild = false

[tool.scikit-build.cmake.define]
SADDLE_BUILD_PYTHON = "ON"
SADDLE_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a GPU and cuEST",
  "ladder: chemistry reaction-ladder suite",
]
addopts = "--strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]
extend-exclude = ["python/saddle/_core.pyi"]  # generated by nanobind stubgen

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
allowed-confusables = ["σ"]  # scientific notation for uncertainty

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
packages = ["saddle"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "h5py", "h5py.*", "cupy", "cupy.*", "cuest", "cuest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["saddle._core"]  # generated by nanobind stubgen; returns plain dicts
disallow_any_generics = false

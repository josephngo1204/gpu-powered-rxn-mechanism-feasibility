[project]
name = "saddle"
version = "0.0.1"
description = "Saddle: a cuEST mechanism feasibility engine"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pyyaml", "h5py"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "types-pyyaml"]

[project.scripts]
saddle = "saddle.cli:main"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
markers = [
  "gpu: requires a GPU and cuEST",
  "ladder: chemistry reaction-ladder suite",
]
addopts = "--strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
packages = ["saddle"]
strict = true

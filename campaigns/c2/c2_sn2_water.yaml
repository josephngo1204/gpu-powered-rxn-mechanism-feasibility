# C2 (spec section 3): Cl- + CH3Cl identity SN2 in PCM water.
# Same surface as C1 with electrostatic C-PCM (SwiG, Bondi x 1.2 radii).
# Expected: the gas-phase ion-dipole double well becomes close to unimodal
# and the barrier rises (estimated dG++ 26 kcal/mol, data/references.yaml).
# PCM is not evidence of explicit-solvent behaviour (spec section 12).
schema_version: 1
hypothesis: c2_hypothesis.yaml
model:
  type: cuest
  functional: WB97X-V        # spec section 4 default
  basis: def2-SVPD           # search profile, as C1
  auxiliary_basis: def2-universal-jkfit
  grid: "(75,302)"
  math_mode: native-fp64
  pcm: {method: C-PCM, lebedev_points: 302}
pathways:
  sn2: {ts_guess: species/ts_sn2.xyz}
symmetry_numbers: {chloride: 1, chloromethane: 3, ts: 6}
quasi_harmonic: true
uncertainty:
  basis: {value: 1.0, source: estimate, note: "def2-SVPD search profile; def2-TZVPD single points pending"}
  method: {value: 1.5, source: estimate, note: "DFT vs CCSD(T) for SN2 barriers; refine from C3 benchmarks"}
  grid: {value: 0.1, source: estimate, note: "(75,302); the G8 grid variant measures it"}
  solvent: {value: 2.0, source: estimate, note: "electrostatic-only C-PCM for an anionic SN2; no cavitation/dispersion terms (spec section 16)"}
robustness:
  grid: {grid: "(99,590)"}
  precision: {math_mode: default}
  functional: {functional: M06-2X}

# Development environment for Saddle.
# GPU stack per docs/adr/0001: CUDA 12.8 runtime libraries (driver 570), CuPy,
# and the cuEST Python bindings from pip (nvidia-cuest-cu12 0.2.2).
name: saddle
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pyyaml
  - h5py
  - cmake>=3.28
  - ninja
  - cxx-compiler
  - eigen
  - gtest
  - rapidcheck
  - nanobind
  - scikit-build-core
  - pytest
  - pytest-cov
  - hypothesis
  - ruff
  - mypy
  - types-pyyaml
  # GPU (CUDA 12.8; driver 570 cannot run CUDA 13)
  - cuda-version=12.8
  - libcublas
  - libcusolver
  - libcusparse
  - cuda-nvrtc
  - libnvjitlink
  - cupy
  # Cross-checks (spec section 10)
  - pyscf
  - basis_set_exchange
  - pip
  - pip:
      - nvidia-cuest-cu12==0.2.2
